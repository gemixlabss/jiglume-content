# Jiglume AI illustration prompts (tools/generate_ai.py). Palettes and guards are
# assigned by tools/assign_palettes.py; edit basePrompt, then re-run it.
version: 1
model: gemini-nano-banana-2.1
aspect_ratio: '3:4'
style: 'Richly detailed digital painting, storybook illustration quality. Vivid, saturated but easy-on-the-eye colours;
  luminous, appealing light that follows the light and palette given above; cheerful, peaceful, cozy atmosphere.
  Jigsaw-friendly composition: fine detail and texture in every region of the picture, no large empty sky or single-colour
  areas; the main subject is near the centre so the picture also works as a square crop. Original scene, not imitating
  any existing artwork, film, game or app.'
negative: 'Absolutely no text of any kind: no letters, words, numbers, signs with writing, labels, captions, watermarks,
  signatures or logos; toy blocks, book spines, jars, clocks, shop fronts and packaging are plain or decorated with
  pictures only, never letters or numbers. No real brands, real celebrities or copyrighted characters, and nothing
  resembling Disney, Pixar or Studio Ghibli designs. People, if any, are small and in the distance, never close-up
  faces. No violence, weapons, blood or scary elements. No famous trademarked building illuminations; use generic
  or imaginary architecture.'
