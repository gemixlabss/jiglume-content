palettes:
  morning: 'Fresh early-morning light: airy pastel palette (soft pink, mint, pale blue, butter yellow), a little
    morning mist, long gentle shadows.'
  midday: 'Bright midday sun: clear deep-blue sky with a few white clouds wherever sky shows, vivid fresh greens
    and saturated true colours, crisp clean shadows.'
  golden: 'Golden hour: low warm sun, honeyed amber light, long shadows and glowing rim light.'
  blue_hour: 'Blue hour / twilight: deep blue and violet sky, the first warm lights in windows and lamps, a cool-and-warm
    colour contrast.'
  night: 'Night: moonlight and starlight with warm lanterns, candles or windows as light sources; deep navy, indigo
    and teal with golden accents; still clearly lit and full of readable detail.'
  snowy: 'Snowy cold palette: crisp whites, icy blues and silvery greys with a few warm accents (red, gold); soft
    diffused winter light.'
  rainy: 'Rainy day: rain on the windows and wet, glistening reflections, soft grey-blue daylight outside contrasted
    with warm lamp light inside (or the fresh, shiny moment just after rain outdoors).'
